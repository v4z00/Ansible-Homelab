- name: Konfigurierte ZFS-Properties abgleichen
  hosts: all_linux_systems
  gather_facts: false
  become: false
  pre_tasks:
  - name: Ausdrueckliches Ziel pruefen
    ansible.builtin.assert:
      that:
      - ansible_limit | default('') | length > 0
      fail_msg: Mit --limit HOST oder GRUPPE starten.
  - name: Feature pruefen
    ansible.builtin.assert:
      that:
      - features.proxmox | default(false) | bool
  tasks:
  - name: ZFS-Konfiguration pruefen
    ansible.builtin.assert:
      that:
      - item.dataset is match('^[A-Za-z0-9][A-Za-z0-9_./:-]*$')
      - item.property in ['compression','atime','relatime','recordsize','xattr','acltype','logbias','primarycache','secondarycache','sync','dedup']
      - item.value is string
    loop: '{{ zfs_property_settings | default([]) }}'
  - name: Aktuelle Properties lesen
    ansible.builtin.command:
      argv:
      - zfs
      - get
      - -H
      - -o
      - value
      - '{{ item.property }}'
      - '{{ item.dataset }}'
    register: zfs_current
    changed_when: false
    check_mode: false
    loop: '{{ zfs_property_settings | default([]) }}'
  - name: Ausdruecklich konfigurierte Property setzen
    ansible.builtin.command:
      argv:
      - zfs
      - set
      - '{{ item.item.property }}={{ item.item.value }}'
      - '{{ item.item.dataset }}'
    loop: '{{ zfs_current.results | default([]) }}'
    when: item.stdout != item.item.value and not ansible_check_mode
    changed_when: true
  - name: Geplante Aenderungen im Check-Modus zeigen
    ansible.builtin.debug:
      msg: '{{ item.item.dataset }}: {{ item.item.property }} {{ item.stdout }} -> {{ item.item.value }}'
    loop: '{{ zfs_current.results | default([]) }}'
    when: ansible_check_mode and item.stdout != item.item.value
