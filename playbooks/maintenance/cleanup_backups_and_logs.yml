---
- name: Backups und historische Logs rotieren/bereinigen
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    project_root: "{{ playbook_dir | dirname | dirname }}"
    retention_days: 2
    engine_script: |
      from pathlib import Path
      import argparse
      import shutil
      import sys
      import tempfile
      import time

      def plan(root, days):
          cutoff = time.time() - (days * 86400)
          removals = []

          # 1. Backups in x/backups/ (.bak und alte manuelle Verzeichnisse)
          backup_dir = root / 'x/backups'
          if backup_dir.is_dir():
              for p in backup_dir.iterdir():
                  if p.name.endswith('.bak') or p.name.startswith(('inventory-', 'manual-')):
                      try:
                          if p.stat().st_mtime < cutoff:
                              removals.append(p)
                      except OSError:
                          pass

          # 2. Alte Controller-Logs in logs/
          log_dir = root / 'logs'
          if log_dir.is_dir():
              for p in log_dir.glob('*.log'):
                  if p.is_file() and not p.name.startswith('scheduler-'):
                      try:
                          if p.stat().st_mtime < cutoff:
                              removals.append(p)
                      except OSError:
                          pass

          # 3. Alte Docker-Deployment-Logs in x/reports/docker/
          docker_log_dir = root / 'x/reports/docker'
          if docker_log_dir.is_dir():
              for p in docker_log_dir.glob('deployment-*.log'):
                  if p.is_file():
                      try:
                          if p.stat().st_mtime < cutoff:
                              removals.append(p)
                      except OSError:
                          pass

          return removals

      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument('root', type=Path)
          parser.add_argument('--days', type=int, default=14)
          parser.add_argument('--apply', action='store_true')
          args = parser.parse_args()
          root = args.root.resolve()

          removals = plan(root, args.days)

          if not removals:
              print('KEINE_ALTEN_LOGS_ODER_BACKUPS_GEFUNDEN')
              return

          for p in sorted(removals):
              print(f"ROTATION (>{args.days} Tage): {p.relative_to(root)}")

          if not args.apply:
              return

          backup = Path(tempfile.mkdtemp(prefix='ansible-backup-cleanup-', dir=root.parent))
          try:
              for p in removals:
                  dst = backup / p.relative_to(root)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if p.is_dir() and not p.is_symlink():
                      shutil.copytree(p, dst, symlinks=True)
                  else:
                      shutil.copy2(p, dst, follow_symlinks=False)

              for p in removals:
                  if p.is_dir() and not p.is_symlink():
                      shutil.rmtree(p)
                  else:
                      p.unlink()
          except Exception:
              print('FEHLER: Sicherung liegt unter ' + str(backup), file=sys.stderr)
              raise

          print('SICHERUNG ' + str(backup))
          print('ROTATION ERFOLGREICH DURCHGEFUEHRT')

      if __name__ == '__main__':
          main()

  vars_prompt:
    - name: confirm_cleanup
      prompt: "Backups und Logs aelter als {{ retention_days }} Tage bereinigen? Fuer Anwendung exakt YES eingeben (Check-Mode zeigt Vorschau)"
      private: false

  tasks:
    - name: Vorschau der rotierbaren Logs und Backups ermitteln
      ansible.builtin.command:
        expand_argument_vars: false
        argv: [python3, -c, "{{ engine_script }}", "{{ project_root }}", "--days", "{{ retention_days }}"]
      register: preview
      check_mode: false
      changed_when: false

    - name: Vorschau anzeigen
      ansible.builtin.debug:
        var: preview.stdout_lines

    - name: Bestaetigung pruefen
      ansible.builtin.assert:
        that: ansible_check_mode or confirm_cleanup == 'YES'
        fail_msg: "Abbruch. Es wurde nichts veraendert."

    - name: Alte Backups und Logs bereinigen
      ansible.builtin.command:
        expand_argument_vars: false
        argv: [python3, -c, "{{ engine_script }}", "{{ project_root }}", "--days", "{{ retention_days }}", --apply]
      register: result
      changed_when: "'SICHERUNG ' in result.stdout"
      when: not ansible_check_mode

    - name: Ergebnis anzeigen
      ansible.builtin.debug:
        var: result.stdout_lines
      when: not ansible_check_mode
